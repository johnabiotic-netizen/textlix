<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/textlix-mark.svg" color="#0A1831" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary SEO -->
    <title>Textlix — Virtual Phone Numbers for SMS Verification</title>
    <meta name="description" content="Get virtual phone numbers from 50+ countries instantly. Receive SMS verification codes in real-time for WhatsApp, Telegram, Google, and more. Pay with card or crypto." />
    <meta name="keywords" content="virtual phone number, SMS verification, temporary phone number, receive SMS online, OTP verification, WhatsApp number, virtual SIM" />
    <link rel="canonical" href="https://www.textlix.com/" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Textlix" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.textlix.com/" />
    <meta property="og:title" content="Textlix — Virtual Phone Numbers for SMS Verification" />
    <meta property="og:description" content="Get virtual phone numbers from 50+ countries instantly. Receive SMS verification codes in real-time for WhatsApp, Telegram, Google, and more." />
    <meta property="og:image" content="https://www.textlix.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Textlix" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@textlix" />
    <meta name="twitter:title" content="Textlix — Virtual Phone Numbers for SMS Verification" />
    <meta name="twitter:description" content="Get virtual phone numbers from 50+ countries instantly. Receive SMS verification codes in real-time." />
    <meta name="twitter:image" content="https://www.textlix.com/og-image.png" />

    <!-- PWA -->
    <meta name="theme-color" content="#0A1831" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F6FAFD" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Textlix" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Textlix",
      "url": "https://www.textlix.com",
      "description": "Virtual phone numbers for SMS verification. Get numbers from 50+ countries instantly and receive verification codes in real-time.",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "Web, Android, iOS",
      "offers": {
        "@type": "Offer",
        "price": "0.50",
        "priceCurrency": "USD",
        "description": "Starting from 50 credits ($0.50)"
      },
      "publisher": {
        "@type": "Organization",
        "name": "Textlix",
        "url": "https://www.textlix.com",
        "logo": "https://www.textlix.com/icons/icon-512.png"
      },
      "featureList": [
        "Virtual phone numbers from 50+ countries",
        "Real-time SMS code delivery",
        "WhatsApp, Telegram, Google verification",
        "Pay with card or cryptocurrency",
        "Long-term number rental"
      ]
    }
    </script>

    <!-- Preconnect to the API host so the public-stats / first-fetch TLS
         handshake overlaps with HTML/JS download instead of running serially. -->
    <link rel="preconnect" href="https://api.textlix.com" crossorigin />

    <!-- Fonts — load the stylesheet non-blocking so it doesn't delay first
         paint. `media="print"` makes the browser fetch but skip parse for the
         initial render; the onload handler then swaps media to apply it.
         `display=swap` in the URL ensures text shows in the fallback font
         until the web font arrives, so there's no invisible-text window.
         The <noscript> path is the no-JS fallback (still render-blocking,
         but acceptable for the ~1% with JS off). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" />
    </noscript>
  </head>
  <body>
    <script>!function(){"dark"===localStorage.getItem("theme")&&document.documentElement.classList.add("dark")}()</script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Live chat is now our own in-house support widget (mounted in UserLayout
         for signed-in users), replacing the third-party Tawk.to embed. -->
  </body>
</html>
