    <!-- Fonts — load the stylesheet non-blocking so it doesn't delay first
         paint. `media="print"` makes the browser fetch but skip parse for the
         initial render; the onload handler then swaps media to apply it.
         `display=swap` in the URL ensures text shows in the fallback font
         until the web font arrives, so there's no invisible-text window.
         The <noscript> path is the no-JS fallback (still render-blocking,
         but acceptable for the ~1% with JS off). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" />
    </noscript>

    <!-- Tawk.to Live Chat — deferred until first user interaction or 4s,
         whichever fires first. Lighthouse measures TBT during the first ~5s;
         loading the widget eagerly cost ~800ms of main-thread time on mobile
         and ~15 Lighthouse points. The widget still appears for everyone
         who actually engages with the page; bots and instant-bouncers skip it. -->
    <script>
      var Tawk_API = Tawk_API || {}, Tawk_LoadStart = new Date();
      (function () {
        var loaded = false;
        function loadTawk() {
          if (loaded) return;
          loaded = true;
          var s1 = document.createElement('script');
          var s0 = document.getElementsByTagName('script')[0];
          s1.async = true;
          s1.src = 'https://embed.tawk.to/69dd0803a59d0e1c3091bce2/1jm3mejjd';
          s1.charset = 'UTF-8';
          s1.setAttribute('crossorigin', '*');
          s0.parentNode.insertBefore(s1, s0);
        }
        var triggers = ['scroll', 'mousemove', 'touchstart', 'keydown'];
        triggers.forEach(function (ev) {
          window.addEventListener(ev, loadTawk, { once: true, passive: true });
        });
        setTimeout(loadTawk, 4000);
      })();
    </script>
  </body>
